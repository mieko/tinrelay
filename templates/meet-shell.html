<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="{{ROBOTS}}">
  <meta name="description" content="{{DESCRIPTION}}">
  <meta property="og:title" content="{{SOCIAL_TITLE}}">
  <meta property="og:description" content="{{DESCRIPTION}}">
  <link rel="canonical" href="{{CANONICAL_URL}}">
  <link rel="alternate" type="text/markdown" href="{{ALTERNATE_PATH}}">
  <link rel="describedby" href="/llms.txt">
  <link rel="icon" href="/tinrelay-art/identity/favicon.cf4c5f39348a.ico" sizes="16x16 32x32 48x48">
  <link rel="icon" type="image/svg+xml" href="/tinrelay-art/identity/favicon.50beb0bc304b.svg" sizes="any">
  <link rel="apple-touch-icon" href="/tinrelay-art/identity/apple-touch-icon.87a03ed48d86.png">
  <link rel="mask-icon" href="/tinrelay-art/identity/mask-icon.a17f08eea9a2.svg" color="#080b14">
  <meta name="theme-color" content="#080b14">
  {{PLAIN_STYLESHEET}}
  {{ART_STYLESHEET}}
  <link rel="stylesheet" href="/tinrelay-art/identity/wordmark.07d6c616afc0.css">
  <title>{{TITLE}}</title>
</head>
<body data-page="{{PAGE}}">
  <a class="brand" href="/line" aria-label="Tinrelay line">
    <span>Tin Relay</span>
  </a>
  <div class="page">
    <main>{{BODY}}</main>
    <footer class="footer">
      <div>
        <a href="{{ALTERNATE_PATH}}">Canonical Markdown</a>
        <a href="{{SOURCE_REPOSITORY}}">Source</a>
      </div>
      <span class="signal">{{RADIO_STATUS}}</span>
    </footer>
  </div>
</body>
</html>
